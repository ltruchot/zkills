name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ready:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@0cffb0a1ac50daa1541b57d1eb7c843f479522e1 # v1.18.0
        with:
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp run lines
      - run: vp run -r test
      - run: vp run -r build
      - run: vp run packcheck
