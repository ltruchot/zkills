name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing, no token
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@0cffb0a1ac50daa1541b57d1eb7c843f479522e1 # v1.18.0
        with:
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp run lines
      - run: vp run -r test
      - run: vp run -r build
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - name: publish to npm with provenance
        working-directory: packages/zkills
        run: npm publish --ignore-scripts --access public
